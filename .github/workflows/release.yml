name: Release

# Changesets manages the "Version Packages" PR (bump + CHANGELOG). When that PR
# merges, the package version changes on main — this workflow detects that,
# cross-compiles the standalone binary for all platforms, and publishes them to
# a GitHub Release. No npm: vcskill ships as a binary via curl|bash / brew.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create the Version PR, tags, and GitHub Releases
  pull-requests: write # open/update the Version Packages PR

jobs:
  release:
    name: Version or Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # need HEAD~1 to detect a version change

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Bun
        # TODO: SHA-pin like the other actions once verified.
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens/updates the "Version Packages" PR while changesets exist. No
      # publish command → this never pushes to npm; it only manages the PR.
      - name: Changesets version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run version-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Fire the binary release only on the commit that bumped the version
      # (i.e. the Version Packages PR merge).
      - name: Detect release
        id: rel
        run: |
          CUR=$(node -p "require('./packages/cli/package.json').version")
          PREV=$(git show HEAD~1:packages/cli/package.json 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.parse(s).version)}catch{console.log('')}})")
          echo "version=$CUR" >> "$GITHUB_OUTPUT"
          if [ "$CUR" != "$PREV" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Cross-compile binaries
        if: steps.rel.outputs.release == 'true'
        run: node packages/cli/scripts/build-binaries.mjs

      - name: Publish GitHub Release
        if: steps.rel.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.rel.outputs.version }}
        run: |
          gh release create "vcskill@${VERSION}" \
            packages/cli/dist/release/* \
            --title "vcskill@${VERSION}" \
            --notes "Standalone binaries for macOS/Linux/Windows. Install: \`curl -fsSL https://raw.githubusercontent.com/bavanchun/vcskill/main/install.sh | bash\`. Verify with checksums.txt."
