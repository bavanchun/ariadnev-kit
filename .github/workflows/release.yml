name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version-pr:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.meta.outputs.release }}
      version: ${{ steps.meta.outputs.version }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      generated_at: ${{ steps.meta.outputs.generated_at }}
      source_date_epoch: ${{ steps.meta.outputs.source_date_epoch }}
      candidate_artifact_name: ${{ steps.meta.outputs.candidate_artifact_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Changesets version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: pnpm run version-packages
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect exact release source
        id: meta
        env:
          SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node packages/cli/scripts/detect-release-source.mjs

  candidate-build:
    needs: [version-pr]
    if: needs.version-pr.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-candidate-build.yml
    with:
      source_sha: ${{ needs.version-pr.outputs.source_sha }}
      version: ${{ needs.version-pr.outputs.version }}
      generated_at: ${{ needs.version-pr.outputs.generated_at }}
      source_date_epoch: ${{ needs.version-pr.outputs.source_date_epoch }}
      candidate_artifact_name: ${{ needs.version-pr.outputs.candidate_artifact_name }}

  candidate-publish:
    needs: [version-pr, candidate-build]
    if: needs.version-pr.outputs.release == 'true'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-candidate-publish.yml
    with:
      source_sha: ${{ needs.version-pr.outputs.source_sha }}
      version: ${{ needs.version-pr.outputs.version }}
      candidate_run_id: ${{ github.run_id }}
      candidate_run_attempt: ${{ github.run_attempt }}
      candidate_artifact_id: ${{ needs.candidate-build.outputs.candidate_artifact_id }}
      candidate_artifact_name: ${{ needs.candidate-build.outputs.candidate_artifact_name }}
      candidate_artifact_digest: ${{ needs.candidate-build.outputs.candidate_artifact_digest }}
