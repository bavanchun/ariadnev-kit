name: Release Candidate Build

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      generated_at:
        required: true
        type: string
      source_date_epoch:
        required: true
        type: string
      candidate_artifact_name:
        required: true
        type: string
    outputs:
      candidate_artifact_id:
        value: ${{ jobs.build.outputs.candidate_artifact_id }}
      candidate_artifact_name:
        value: ${{ jobs.build.outputs.candidate_artifact_name }}
      candidate_artifact_digest:
        value: ${{ jobs.build.outputs.candidate_artifact_digest }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      candidate_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_artifact_name: ${{ inputs.candidate_artifact_name }}
      candidate_artifact_digest: sha256:${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          cache: pnpm
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Resolve immediate previous stable
        id: previous
        env:
          CURRENT_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p packages/cli/dist/candidate
          node packages/cli/scripts/resolve-previous-stable.mjs --version "$CURRENT_VERSION" --repository-root . > packages/cli/dist/candidate/previous-stable.json
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const value = JSON.parse(fs.readFileSync("packages/cli/dist/candidate/previous-stable.json", "utf8"));
          process.stdout.write(`release_tag=${value.releaseTag}\nsource_sha=${value.productSha}\n`);
          NODE
      - name: Checkout previous stable exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.previous.outputs.release_tag }}
          path: previous-stable
          fetch-depth: 1
          persist-credentials: false
      - name: Lock previous stable source tree
        env:
          PREVIOUS_SOURCE_TAG: ${{ steps.previous.outputs.release_tag }}
          PREVIOUS_SOURCE_SHA: ${{ steps.previous.outputs.source_sha }}
        run: |
          test "$(git -C previous-stable rev-parse HEAD)" = "$PREVIOUS_SOURCE_SHA"
          test "$(git -C previous-stable rev-parse "${PREVIOUS_SOURCE_TAG}^{commit}")" = "$PREVIOUS_SOURCE_SHA"
          test -z "$(git -C previous-stable status --porcelain)"
          find previous-stable -path previous-stable/.git -prune -o \( -type f -o -type d \) -exec chmod a-w {} +
      - name: Build release assets
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          GENERATED_AT: ${{ inputs.generated_at }}
          SOURCE_DATE_EPOCH: ${{ inputs.source_date_epoch }}
          RELEASE_VERSION: ${{ inputs.version }}
          PREVIOUS_SOURCE_TAG: ${{ steps.previous.outputs.release_tag }}
          PREVIOUS_SOURCE_SHA: ${{ steps.previous.outputs.source_sha }}
        run: |
          node packages/cli/scripts/build-binaries.mjs \
            --source-sha "$SOURCE_SHA" \
            --generated-at "$GENERATED_AT" \
            --source-date-epoch "$SOURCE_DATE_EPOCH" \
            --release-tag "ariadnev@$RELEASE_VERSION" \
            --previous-source-tree "$GITHUB_WORKSPACE/previous-stable" \
            --previous-source-tag "$PREVIOUS_SOURCE_TAG" \
            --previous-source-sha "$PREVIOUS_SOURCE_SHA"
      - name: Create inner provenance A
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ariadnev@${{ inputs.version }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          mkdir -p packages/cli/dist/candidate
          node packages/cli/scripts/create-release-attestation.mjs packages/cli/dist/release packages/cli/dist/candidate/release-artifact-attestation.json .github/release/release-artifact-attestation.schema.json
      - name: Stage flat candidate inventory
        run: node packages/cli/scripts/stage-release-candidate.mjs packages/cli/dist/release packages/cli/dist/candidate/release-artifact-attestation.json packages/cli/dist/candidate-upload
      - name: Upload exact candidate artifact
        id: upload
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: packages/cli/dist/candidate-upload/*
          if-no-files-found: error
          retention-days: 90
          overwrite: false
