name: CI

# Two paths never reach any gate in the `ci` job, so a commit touching only
# them buys a ~14-minute run that can only pass:
#   plans/**   — dated plans and reports. Nothing in that job reads the real
#                directory (the plan-command tests use in-memory fixtures), and
#                check-brand-drift.mjs already allowlists the `plans/` prefix
#                because those documents quote the old name on purpose.
#   .claude/** — local agent working state. Nothing tracked lives there today
#                and no gate reads it, but agents churn it constantly.
#
# TWO TIERS. A pull request into `dev` runs `Lint · Validate · Unit` (~5 min:
# typecheck, kit validation, unit tests, script tests); a push to `dev` or
# `main`, a pull request into `main`, and the Monday run execute
# `Lint · Build · Test` (~14 min: everything above plus the binary build, the
# end-to-end install, coverage thresholds, the docs-bundle and benchmark
# determinism checks). `dev` is the integration branch: every merge into it is
# a rebase, so the push run is the first time the merged tree exists, and it
# is the run that carries the full verdict. `main` is the release branch and
# the release chain reads its `Lint · Build · Test` verdict before cutting.
# Required status checks: `Lint · Validate · Unit` on `dev`, `Lint · Build ·
# Test` on `main`. The trade is explicit: a unit-green PR whose integration
# gate fails is caught on `dev` after the merge, not before, and is fixed
# forward there.
#
# THE FILTER IS A JOB CONDITION, NOT A TRIGGER FILTER — do not "simplify" it
# back into `paths-ignore:` under `on:`. A trigger-level `paths-ignore` makes
# the whole workflow never start, and GitHub then leaves the required check
# Pending forever: "If a workflow is skipped due to path filtering … checks
# associated with that workflow will remain in a Pending state. A pull request
# that requires those checks to be successful will be blocked from merging."
# A docs-only PR would be unmergeable. A job skipped by `if:` instead reports
# "skipped", which required status checks count as success — so the workflow
# always starts, and `changes` decides whether either gate does any work.
#
# `changes` fails open in every direction: a new branch, a force-push whose
# base is gone, an API error, an unrecognised event, or the job itself failing
# all run the full gate. Only a positive, complete file list that lies entirely
# inside the two paths above skips it.
#
# Unlike plans/, `.claude/` is NOT brand-drift-allowlisted, so text committed
# there could carry drift past this filter. The Monday run is the backstop that
# closes that hole: it re-scans the whole tree regardless of what changed.
on:
  push:
    branches: [main, dev]
  # dev is where work actually lands; without it here a PR into dev gets no
  # checks at all and the review gate is decorative.
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly full run on the default branch: catches anything the path filter
    # above deferred, and proves the pipeline still works on a quiet week.
    - cron: "0 3 * * 1"

permissions: {}

concurrency:
  # A PR that is pushed twice in a minute should not pay for the first run:
  # 14 of 56 runs in the week of 2026-08-16 finished after being superseded.
  # `main` is the exception — the release chain reads CI's verdict on the
  # commit it is about to cut from, and a cancelled run has no verdict. On a
  # pull_request event github.ref is refs/pull/N/merge, so PRs and dev pushes
  # both cancel; only refs/heads/main does not.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - name: Decide whether the full gate must run
        id: detect
        env:
          # gh is preinstalled on every runner, so this needs no third-party
          # action and no checkout. Every value below is passed as an
          # environment variable rather than interpolated into the script.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Every uncertain path lands here. The expensive answer is the safe
          # one, so it is also the default: nothing below may skip the gate
          # without a complete file list proving the change is ignorable.
          run_full_gate() {
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "full gate: $1"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              [ -n "$PR_NUMBER" ] || run_full_gate "pull_request carried no number"
              files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename') \
                || run_full_gate "could not list the files of pull request $PR_NUMBER"
              ;;
            push)
              # All-zeros is a branch that did not exist before this push, so
              # there is no base to compare against.
              case "$BEFORE_SHA" in
                "" | 0000000000000000000000000000000000000000)
                  run_full_gate "push has no previous commit to compare against" ;;
              esac
              # A force-push whose old tip is gone makes this 404, which is a
              # failure and therefore runs the gate.
              files=$(gh api "repos/$REPO/compare/$BEFORE_SHA...$AFTER_SHA" --paginate --jq '.files[].filename') \
                || run_full_gate "could not compare $BEFORE_SHA...$AFTER_SHA"
              ;;
            *)
              # schedule is the weekly backstop and must scan everything.
              # Anything else is an event this logic has never been read
              # against, which is the same as not knowing.
              run_full_gate "event $EVENT_NAME always runs the full gate" ;;
          esac

          [ -n "$files" ] || run_full_gate "the API returned no files"

          # Both endpoints stop enumerating at 3000 files, and a truncated list
          # could look ignorable while hiding real changes behind the cut.
          count=$(printf '%s\n' "$files" | wc -l | tr -d '[:space:]')
          [ "$count" -lt 3000 ] || run_full_gate "file list hit the API cap at $count"

          outside=$(printf '%s\n' "$files" | grep -vE '^(plans/|\.claude/)' || true)
          if [ -n "$outside" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "full gate: $(printf '%s\n' "$outside" | wc -l | tr -d '[:space:]') of $count changed files are outside plans/ and .claude/"
            printf '%s\n' "$outside" | head -20
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "skipping: all $count changed files are under plans/ or .claude/"
          fi

  unit:
    name: Lint · Validate · Unit
    needs: [changes]
    # Pull requests into dev only. `!cancelled()` is what lets this run even
    # when `changes` failed — without a status function here, a failed `needs`
    # would silently skip the job, and a skipped required check counts as
    # success. So: run unless the whole run was cancelled and `changes`
    # positively said there is nothing to check.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.base_ref == 'dev' && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # docs-bundle-generator.test.ts (inside the unit run) clones this
          # checkout and checks out a pre-rename release tag; see the full
          # gate's note. A shallow tree fails it.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Brand drift gate
        run: node packages/cli/scripts/check-brand-drift.mjs

      - name: Typecheck
        run: pnpm run lint

      - name: Validate kit + provider-matrix drift
        # Same check as the full gate, run from source under bun (the binary is
        # bun-compiled, so this is the runtime it ships on) — no build needed.
        run: bun packages/cli/src/index.ts validate --check --strict

      - name: Installer syntax gate
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host "install.ps1 parses clean"'

      - name: Cross-skill link shape gate
        # Mirrors the full gate; see its comment for why grep and why -o.
        run: |
          if grep -rnI 'kits/core/' kit/; then
            echo "::error::stale pre-rename root — the tree is kit/, with hooks under kit/hooks/_lib/"
            exit 1
          fi
          if grep -rIoE '(\.\./)+[a-z][a-z0-9-]*/references/' kit/ | grep -vE ':(\.\./)+av-'; then
            echo "::error::cross-skill link missing the av- prefix"
            exit 1
          fi

      - name: Unit tests
        # No coverage here: the thresholds are enforced by the full gate on
        # the merged tree, where a drop is attributable to one push.
        run: pnpm exec vitest run

      - name: Test scripts + hooks (node:test)
        run: |
          find packages/cli/scripts -name '*.test.mjs' -print0 | xargs -0 -r node --test
          find kit/hooks kit/statusline -name '*.test.cjs' -print0 | xargs -0 -r node --test

  ci:
    name: Lint · Build · Test
    needs: [changes]
    # Everything except a pull request into dev: pushes to dev and main, the
    # weekly run, and pull requests into main. Same `!cancelled()` reasoning
    # as the unit job.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.base_ref == 'main') && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history AND tags, deliberately — two gates below need both and
          # fail closed without them, so this is not the cheap win it looks like:
          #   "Build-binaries integration gate" → build-binaries.test.mjs calls
          #   resolvePreviousStable(), which reads `git tag --list ariadnev@*`
          #   and throws "no previous stable release exists" on a shallow tree;
          #   "Release bundle focused gates" → docs-bundle-generator.test.ts
          #   clones this checkout and checks out a pre-rename release tag.
          # Verified on a simulated depth-1 checkout (0 tags, 1 commit): both
          # break. Only check-brand-drift.mjs is shallow-safe (git ls-files).
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release bundle focused gates
        run: pnpm exec vitest run packages/cli/src/release

      - name: Build-binaries integration gate
        run: pnpm run test:build-binaries

      - name: End-to-end install gate
        # Installs the whole kit into a temp tree for every provider with a
        # verified cell, checks each recorded file against its recorded hash and
        # its declared target root, checks hook binding order, then uninstalls
        # and checks nothing survives. The provider evidence table is a dated
        # snapshot; this is what re-checks it after the install path changes.
        run: pnpm exec vitest run packages/cli/src/install/e2e-install.test.ts

      - name: Installer syntax gate
        # install.sh and install.ps1 are served straight from this repo by the
        # edge Worker, so a syntax error there breaks onboarding for everyone
        # the moment it merges — with no release to roll back. pwsh is present
        # on ubuntu-latest; bash -n is free.
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host "install.ps1 parses clean"'

      - name: Cross-skill link shape gate
        # The validator only sees skills loadKit enumerates, and that walk is
        # non-recursive (load-kit.ts) while install-plan.ts copies subtrees
        # recursively. So nested dirs — document-skills/{pdf,pptx,docx,xlsx},
        # payment-integration, code-review/references/checklists,
        # deploy/references/platforms — ship to users and run at runtime while
        # being invisible to every check above. They hold no cross-skill links
        # today; grep is what keeps it that way.
        # -o so each PATH is filtered, not each line. Filtering whole lines lets
        # a good link on the same line hide a bad one:
        #   see [a](../av-cook/references/x.md) and [b](../plan/references/y.md)
        # would pass a line-level `grep -v`.
        run: |
          if grep -rnI 'kits/core/' kit/; then
            echo "::error::stale pre-rename root — the tree is kit/, with hooks under kit/hooks/_lib/"
            exit 1
          fi
          if grep -rIoE '(\.\./)+[a-z][a-z0-9-]*/references/' kit/ | grep -vE ':(\.\./)+av-'; then
            echo "::error::cross-skill link missing the av- prefix"
            exit 1
          fi

      - name: Brand drift gate
        run: node packages/cli/scripts/check-brand-drift.mjs

      - name: Typecheck
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Validate kit + provider-matrix drift
        # --strict counts orphan and dangling reference warnings as failures.
        # The inherited backlog was cleared, so a file nobody links is now a new
        # one — the point at which it is cheapest to fix.
        run: node packages/cli/dist/index.js validate --check --strict

      - name: Test + Coverage gate
        run: pnpm run coverage

      - name: Deterministic provisional docs bundle
        run: |
          bun packages/cli/scripts/generate-docs-bundle.ts --mode provisional --output-dir "$RUNNER_TEMP/docs-a"
          bun packages/cli/scripts/generate-docs-bundle.ts --mode provisional --output-dir "$RUNNER_TEMP/docs-b"
          node packages/cli/scripts/compare-docs-bundle-output.mjs "$RUNNER_TEMP/docs-a" "$RUNNER_TEMP/docs-b"

      - name: Deterministic graph-harness benchmarks
        run: |
          bun packages/cli/scripts/benchmark-event-store.ts > "$RUNNER_TEMP/event-store-benchmark.json"
          bun packages/cli/scripts/benchmark-graph-runner.ts > "$RUNNER_TEMP/graph-runner-benchmark.json"
          bun packages/cli/scripts/benchmark-safe-change-runner.ts > "$RUNNER_TEMP/safe-change-benchmark.json"
          bun packages/cli/scripts/benchmark-context.mjs > "$RUNNER_TEMP/context-graph-benchmark.json"

      - name: Test scripts + hooks (node:test)
        run: |
          find packages/cli/scripts -name '*.test.mjs' -print0 | xargs -0 -r node --test
          # Only the trees this repo authors. A ported skill ships upstream's own
          # tests, which are content — running them would make this build red on
          # someone else's expectations about someone else's environment.
          find kit/hooks kit/statusline -name '*.test.cjs' -print0 | xargs -0 -r node --test
