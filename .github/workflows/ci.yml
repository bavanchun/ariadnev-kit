name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Validate kit + provider-matrix drift
        run: node packages/cli/dist/index.js validate --check

      - name: Test + Coverage gate
        run: pnpm run coverage

      - name: Test scripts + hooks (node:test)
        # Node 20's test runner does not expand glob patterns (that landed in
        # Node 21), so enumerate the files with find for version-independence.
        run: |
          find packages/cli/scripts -name '*.test.mjs' -print0 | xargs -0 -r node --test
          find kit/hooks -name '*.test.cjs' -print0 | xargs -0 -r node --test
