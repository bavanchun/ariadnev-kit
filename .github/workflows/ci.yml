name: CI

on:
  push:
    branches: [main, dev]
  # dev is where work actually lands; without it here a PR into dev gets no
  # checks at all and the review gate is decorative.
  pull_request:
    branches: [main, dev]

permissions: {}

jobs:
  ci:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release bundle focused gates
        run: pnpm exec vitest run packages/cli/src/release

      - name: Build-binaries integration gate
        run: pnpm run test:build-binaries

      - name: End-to-end install gate
        # Installs the whole kit into a temp tree for every provider with a
        # verified cell, checks each recorded file against its recorded hash and
        # its declared target root, checks hook binding order, then uninstalls
        # and checks nothing survives. The provider evidence table is a dated
        # snapshot; this is what re-checks it after the install path changes.
        run: pnpm exec vitest run packages/cli/src/install/e2e-install.test.ts

      - name: Installer syntax gate
        # install.sh and install.ps1 are served straight from this repo by the
        # edge Worker, so a syntax error there breaks onboarding for everyone
        # the moment it merges — with no release to roll back. pwsh is present
        # on ubuntu-latest; bash -n is free.
        run: |
          bash -n install.sh
          pwsh -NoProfile -Command '
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
            if ($errors.Count) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
            Write-Host "install.ps1 parses clean"'

      - name: Cross-skill link shape gate
        # The validator only sees skills loadKit enumerates, and that walk is
        # non-recursive (load-kit.ts) while install-plan.ts copies subtrees
        # recursively. So nested dirs — document-skills/{pdf,pptx,docx,xlsx},
        # payment-integration, code-review/references/checklists,
        # deploy/references/platforms — ship to users and run at runtime while
        # being invisible to every check above. They hold no cross-skill links
        # today; grep is what keeps it that way.
        run: |
          if grep -rn 'kits/core/skills/' kit/; then
            echo "::error::stale pre-rename skills root — write ../av-<slug>/… instead"
            exit 1
          fi
          if grep -rnE '(\.\./)+[a-z][a-z0-9-]*/references/' kit/ | grep -v '\.\./av-'; then
            echo "::error::cross-skill link missing the av- prefix"
            exit 1
          fi

      - name: Brand drift gate
        run: node packages/cli/scripts/check-brand-drift.mjs

      - name: Typecheck
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Validate kit + provider-matrix drift
        # --strict counts orphan and dangling reference warnings as failures.
        # The inherited backlog was cleared, so a file nobody links is now a new
        # one — the point at which it is cheapest to fix.
        run: node packages/cli/dist/index.js validate --check --strict

      - name: Test + Coverage gate
        run: pnpm run coverage

      - name: Deterministic provisional docs bundle
        run: |
          bun packages/cli/scripts/generate-docs-bundle.ts --mode provisional --output-dir "$RUNNER_TEMP/docs-a"
          bun packages/cli/scripts/generate-docs-bundle.ts --mode provisional --output-dir "$RUNNER_TEMP/docs-b"
          node packages/cli/scripts/compare-docs-bundle-output.mjs "$RUNNER_TEMP/docs-a" "$RUNNER_TEMP/docs-b"

      - name: Deterministic graph-harness benchmarks
        run: |
          bun packages/cli/scripts/benchmark-event-store.ts > "$RUNNER_TEMP/event-store-benchmark.json"
          bun packages/cli/scripts/benchmark-graph-runner.ts > "$RUNNER_TEMP/graph-runner-benchmark.json"
          bun packages/cli/scripts/benchmark-safe-change-runner.ts > "$RUNNER_TEMP/safe-change-benchmark.json"
          bun packages/cli/scripts/benchmark-context.mjs > "$RUNNER_TEMP/context-graph-benchmark.json"

      - name: Test scripts + hooks (node:test)
        run: |
          find packages/cli/scripts -name '*.test.mjs' -print0 | xargs -0 -r node --test
          # Only the trees this repo authors. A ported skill ships upstream's own
          # tests, which are content — running them would make this build red on
          # someone else's expectations about someone else's environment.
          find kit/hooks kit/statusline -name '*.test.cjs' -print0 | xargs -0 -r node --test
