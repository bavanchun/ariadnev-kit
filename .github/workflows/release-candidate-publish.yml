name: Release Candidate Publish

on:
  workflow_call:
    inputs:
      source_sha: { required: true, type: string }
      version: { required: true, type: string }
      candidate_run_id: { required: true, type: string }
      candidate_run_attempt: { required: true, type: string }
      candidate_artifact_id: { required: true, type: string }
      candidate_artifact_name: { required: true, type: string }
      candidate_artifact_digest: { required: true, type: string }
    outputs:
      mode:
        value: ${{ jobs.publish.outputs.mode }}
      release_id:
        value: ${{ jobs.publish.outputs.release_id }}
      candidate_envelope:
        value: ${{ jobs.publish.outputs.candidate_envelope }}

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.publish.outputs.mode }}
      release_id: ${{ steps.publish.outputs.release_id }}
      candidate_envelope: ${{ steps.publish.outputs.candidate_envelope }}
    steps:
      - name: Publish held draft from exact candidate
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_VERSION: 2026-03-10
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ariadnev@${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
        run: |
          node <<'NODE'
          const { spawnSync, execFileSync } = require("node:child_process");
          const { createHash } = require("node:crypto");
          const { appendFileSync, mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const env = process.env;
          const repo = env.GITHUB_REPOSITORY, tag = env.RELEASE_TAG, sha = env.SOURCE_SHA;
          const runId = env.CANDIDATE_RUN_ID, attempt = env.CANDIDATE_RUN_ATTEMPT;
          const artifactId = env.CANDIDATE_ARTIFACT_ID, artifactName = env.CANDIDATE_ARTIFACT_NAME, artifactDigest = env.CANDIDATE_ARTIFACT_DIGEST;
          const fail = (message) => { throw new Error(message); };
          const ok = (condition, message) => condition || fail(message);
          const digest = (bytes) => `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
          // maxBuffer matches the candidate ceiling asserted below. The default
          // is 1MB, and the candidate zip is ~192MB, so every binary download
          // failed as an opaque "GitHub API request failed".
          const runGh = (args, { binary = false, input } = {}) => spawnSync("gh", args, { encoding: binary ? null : "utf8", input, maxBuffer: 536870912 });
          const baseArgs = ["api", "-H", `X-GitHub-Api-Version: ${env.GITHUB_API_VERSION}`];
          const api = (path, { method, body, binary = false, accept } = {}) => {
            const args = [...baseArgs];
            if (accept) args.push("-H", `Accept: ${accept}`);
            if (method) args.push("--method", method);
            if (body) args.push("--input", "-");
            args.push(path);
            const result = runGh(args, { binary, input: body ? JSON.stringify(body) : undefined });
            if (result.status !== 0) fail("GitHub API request failed");
            return binary ? result.stdout : JSON.parse(result.stdout || "{}");
          };
          const maybe = (path) => {
            const result = runGh([...baseArgs, path]);
            if (result.status === 0) return JSON.parse(result.stdout || "{}");
            if (/\bHTTP 404\b/.test(String(result.stderr))) return null;
            fail("GitHub API preflight failed");
          };
          // Accept stable and SemVer 2.0 prereleases so phase-11 beta cuts
          // (`ariadnev@1.2.1-beta.0`) reach the held-draft step. Finalization
          // is what decides whether a draft becomes a public latest.
          ok(/^[a-f0-9]{40}$/.test(sha) && /^ariadnev@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/.test(tag), "invalid release identity");
          ok(/^[0-9]+$/.test(runId) && /^[0-9]+$/.test(attempt) && /^[0-9]+$/.test(artifactId), "invalid candidate identity");
          ok(/^sha256:[a-f0-9]{64}$/.test(artifactDigest), "invalid candidate digest");
          ok(artifactName === `ariadnev-candidate-${sha}-run-${runId}-attempt-${attempt}`, "candidate name drift");
          const run = api(`repos/${repo}/actions/runs/${runId}`);
          ok(run.path === ".github/workflows/release.yml" && run.event === "push" && run.head_sha === sha && String(run.run_attempt) === attempt && run.status === "in_progress", "candidate run drift");
          const artifact = api(`repos/${repo}/actions/artifacts/${artifactId}`);
          ok(String(artifact.id) === artifactId && artifact.name === artifactName && artifact.digest === artifactDigest && !artifact.expired, "artifact envelope drift");
          ok(String(artifact.workflow_run?.id) === runId && artifact.workflow_run?.head_sha === sha && artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 536870912, "artifact workflow drift");
          ok(!Number.isNaN(Date.parse(artifact.created_at)) && Date.parse(artifact.expires_at) > Date.now(), "candidate artifact is expired or undated");
          const artifactHistory = [];
          for (let page = 1; page <= 10; page += 1) { const batch = api(`repos/${repo}/actions/artifacts?per_page=100&page=${page}`).artifacts || []; artifactHistory.push(...batch); if (batch.length < 100) break; if (page === 10) fail("candidate artifact history exceeds the pagination bound"); }
          const rejectedArtifacts = artifactHistory.filter((entry) => String(entry.id) !== artifactId && !entry.expired && entry.workflow_run?.head_sha === sha && entry.name?.startsWith(`ariadnev-candidate-${sha}-run-`)).map((entry) => {
            const match = /-run-(\d+)-attempt-(\d+)$/.exec(entry.name);
            ok(match && /^sha256:[a-f0-9]{64}$/.test(entry.digest), "prior candidate envelope drift");
            return { artifactId: String(entry.id), artifactName: entry.name, artifactDigest: entry.digest, runId: match[1], runAttempt: match[2] };
          }).sort((left, right) => Number(left.artifactId) - Number(right.artifactId));
          ok(rejectedArtifacts.length <= 32, "too many prior candidate envelopes");
          const envelope = { schemaVersion: 1, schema: "https://ariadnev.com/schemas/candidate-envelope.schema.json", repository: repo, runId, runAttempt: attempt, artifactId, artifactName, artifactDigest, artifactSize: artifact.size_in_bytes, createdAt: artifact.created_at, expiresAt: artifact.expires_at, workflowPath: ".github/workflows/release.yml", headSha: sha, rejectedArtifacts };
          const zip = api(`repos/${repo}/actions/artifacts/${artifactId}/zip`, { binary: true });
          ok(digest(zip) === artifactDigest, "artifact zip digest drift");
          mkdirSync("candidate", { recursive: true });
          writeFileSync("candidate/candidate.zip", zip);
          const listing = execFileSync("unzip", ["-Z1", "candidate/candidate.zip"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          ok(listing.length <= 32 && listing.every((name) => /^[A-Za-z0-9][A-Za-z0-9._@+-]*$/.test(name)), "unsafe candidate inventory");
          const sizes = execFileSync("unzip", ["-l", "candidate/candidate.zip"], { encoding: "utf8" }).split("\n").map((line) => /^\s*(\d+)\s+(?:\d{4}-\d{2}-\d{2}|\d{2}-\d{2}-\d{4})\s+\d{2}:\d{2}\s+(.+)$/.exec(line)).filter(Boolean).map((match) => Number(match[1]));
          ok(sizes.length === listing.length && sizes.every((size) => Number.isSafeInteger(size) && size >= 0) && sizes.reduce((sum, size) => sum + size, 0) <= 536870912, "candidate expands beyond the byte limit");
          execFileSync("unzip", ["-q", "candidate/candidate.zip", "-d", "candidate"]);
          const attestation = JSON.parse(readFileSync("candidate/release-artifact-attestation.json", "utf8"));
          ok(attestation.schemaVersion === 2 && attestation.schema === "https://ariadnev.com/schemas/release-artifact-attestation.schema.json" && attestation.artifactName === artifactName, "attestation schema drift");
          ok(attestation.workflow?.runId === runId && attestation.workflow?.runAttempt === attempt && attestation.workflow?.path === ".github/workflows/release.yml" && attestation.workflow?.ref === `${repo}/.github/workflows/release.yml@refs/heads/main` && attestation.workflow?.sha === sha && /^sha256:[a-f0-9]{64}$/.test(attestation.workflow?.digest), "attestation workflow drift");
          ok(attestation.product?.sha === sha && attestation.product?.tag === tag && tag === `ariadnev@${attestation.product?.version}`, "attestation product drift");
          ok(attestation.generator?.path === "packages/cli/scripts/generate-docs-bundle.ts" && attestation.generator?.sha === sha && /^sha256:[a-f0-9]{64}$/.test(attestation.generator?.digest), "attestation generator drift");
          const required = ["checksums.txt", "docs-bundle-manifest-v1.schema.json", "docs-bundle.manifest.json", "docs-bundle.tar.gz", "ariadnev-darwin-arm64", "ariadnev-darwin-x64", "ariadnev-linux-arm64", "ariadnev-linux-x64", "ariadnev-windows-x64.exe"].sort((left, right) => left.localeCompare(right));
          const assets = [...(attestation.releaseAssets || [])].sort((left, right) => left.name.localeCompare(right.name));
          ok(JSON.stringify(assets.map((entry) => entry.name)) === JSON.stringify(required), "release asset inventory drift");
          ok(new Set(assets.map((entry) => entry.name)).size === assets.length && JSON.stringify([...listing].sort()) === JSON.stringify(["release-artifact-attestation.json", ...required].sort()), "candidate zip contents drift");
          for (const asset of assets) { const bytes = readFileSync(`candidate/${asset.name}`); ok(asset.size === bytes.length && asset.digest === digest(bytes), `candidate asset drift: ${asset.name}`); }
          const checksumLines = readFileSync("candidate/checksums.txt", "utf8").trim().split("\n").map((line) => /^([a-f0-9]{64})  ([A-Za-z0-9][A-Za-z0-9._@+-]*)$/.exec(line));
          ok(checksumLines.every(Boolean) && JSON.stringify(checksumLines.map((match) => match[2]).sort()) === JSON.stringify(required.filter((name) => name !== "checksums.txt")), "checksums inventory drift");
          for (const match of checksumLines) ok(assets.find((asset) => asset.name === match[2])?.digest === `sha256:${match[1]}`, `checksum drift: ${match[2]}`);
          const downloadAsset = (id) => api(`repos/${repo}/releases/assets/${id}`, { binary: true, accept: "application/octet-stream" });
          const verifyRelease = (release) => {
            ok(release.draft === true && release.immutable === false && release.tag_name === tag && release.target_commitish === sha && (release.assets || []).length === assets.length, "held draft drift");
            for (const asset of assets) { const remote = release.assets.find((entry) => entry.name === asset.name); ok(remote && remote.size === asset.size && digest(downloadAsset(remote.id)) === asset.digest, `remote asset drift: ${asset.name}`); }
          };
          // Listed, not resolved by tag. The release this looks for is a draft,
          // and /releases/tags/{tag} answers 404 for drafts — so asking by tag
          // made the held draft invisible to its own publisher: a rerun could
          // never reach EXACT-NOOP, and a leftover draft could be overwritten by
          // a fresh tag instead of stopping the run.
          const releaseList = api(`repos/${repo}/releases?per_page=100`);
          ok(Array.isArray(releaseList) && releaseList.length < 100, "release listing drift");
          const tagRef = maybe(`repos/${repo}/git/ref/tags/${tag}`), release = releaseList.find((entry) => entry.tag_name === tag) || null, latestBefore = maybe(`repos/${repo}/releases/latest`);
          const marker = "ariadnev-candidate-envelope-v1\n";
          if (tagRef || release) {
            ok(tagRef && release && tagRef.object?.type === "tag", "remote state conflict");
            const tagObject = api(`repos/${repo}/git/tags/${tagRef.object.sha}`);
            ok(tagObject.object?.type === "commit" && tagObject.object.sha === sha && tagObject.message === marker + JSON.stringify(envelope), "tag envelope drift");
            verifyRelease(release);
            ok(!latestBefore || String(latestBefore.id) !== String(release.id), "held draft latest drift");
            appendFileSync(env["GITHUB_OUTPUT"], `mode=EXACT-NOOP\nrelease_id=${release.id}\ncandidate_envelope=${JSON.stringify(envelope)}\n`);
            process.exit(0);
          }
          const tagObject = api(`repos/${repo}/git/tags`, { method: "POST", body: { tag, message: marker + JSON.stringify(envelope), object: sha, type: "commit" } });
          api(`repos/${repo}/git/refs`, { method: "POST", body: { ref: `refs/tags/${tag}`, sha: tagObject.sha } });
          const created = api(`repos/${repo}/releases`, { method: "POST", body: { tag_name: tag, target_commitish: sha, name: tag, body: "Held draft release; candidate envelope is bound in the annotated tag.", draft: true, make_latest: "false" } });
          const upload = runGh(["release", "upload", tag, ...assets.map((asset) => `candidate/${asset.name}`), "--repo", repo]);
          if (upload.status !== 0) fail("release asset upload failed");
          verifyRelease(api(`repos/${repo}/releases/${created.id}`));
          const latestAfter = maybe(`repos/${repo}/releases/latest`);
          ok(String(latestAfter?.id || "") === String(latestBefore?.id || ""), "latest endpoint changed");
          appendFileSync(env["GITHUB_OUTPUT"], `mode=FRESH\nrelease_id=${created.id}\ncandidate_envelope=${JSON.stringify(envelope)}\n`);
          NODE
