name: Finalize Release

on:
  workflow_dispatch:
    inputs:
      release_id: { description: GitHub release database ID, required: true, type: string }
      tag: { description: Exact release tag, required: true, type: string }
      source_sha: { description: Exact pushed source SHA, required: true, type: string }
      candidate_run_id: { description: Candidate workflow run ID, required: true, type: string }
      candidate_run_attempt: { description: Candidate workflow run attempt, required: true, type: string }
      candidate_artifact_id: { description: Candidate artifact ID, required: true, type: string }
      candidate_artifact_name: { description: Candidate artifact name, required: true, type: string }
      candidate_artifact_digest: { description: Candidate artifact digest, required: true, type: string }
      # Made locally, with the offline release key, over `<version>\n<checksums.txt bytes>`:
      #   gh run download <candidate_run_id> -n <candidate_artifact_name> -D c
      #   { printf '%s\n' "<version>"; cat c/checksums.txt; } \
      #     | openssl pkeyutl -sign -rawin -inkey ~/ariadnev-release.key | base64 | tr -d '\n'
      # This workflow only ever verifies. The key never becomes an Actions secret,
      # because that would move the trust root from the maintainer to the GitHub
      # account — the same substitution the signature exists to prevent.
      checksums_signature: { description: Base64 Ed25519 signature over "<version>\n<checksums.txt>", required: true, type: string }

permissions: {}

concurrency:
  group: core-release-production-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    # No `environment:`. Deployment environments are a paid feature on a private
    # repository, so declaring one here made the job unschedulable. It protected
    # nothing anyway: approval gates guard a maintainer from other maintainers,
    # and there is one. The concurrency group above still serializes finalization
    # per tag, which is the property that actually matters.
    permissions:
      contents: write
      actions: read
      checks: read
    outputs:
      finalization_attestation: ${{ steps.finalize.outputs.finalization_attestation }}
    steps:
      - name: Finalize held draft release
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_VERSION: 2026-03-10
          GITHUB_REPOSITORY: ${{ github.repository }}
          EXACT_WORKFLOW_SHA: ${{ github.workflow_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_REF_TYPE: ${{ github.ref_type }}
          FINALIZATION_RUN_ID: ${{ github.run_id }}
          FINALIZATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          CHECKSUMS_SIGNATURE: ${{ inputs.checksums_signature }}
        run: |
          node <<'NODE'
          const { spawnSync, execFileSync } = require("node:child_process");
          const { createHash, createPublicKey, verify: verifySignature } = require("node:crypto");
          const { appendFileSync, mkdirSync, readFileSync, writeFileSync } = require("node:fs");
          const env = process.env, repo = env.GITHUB_REPOSITORY, releaseId = env.RELEASE_ID;
          const tag = env.RELEASE_TAG, sha = env.SOURCE_SHA, runId = env.CANDIDATE_RUN_ID, attempt = env.CANDIDATE_RUN_ATTEMPT;
          const artifactId = env.CANDIDATE_ARTIFACT_ID, artifactName = env.CANDIDATE_ARTIFACT_NAME, artifactDigest = env.CANDIDATE_ARTIFACT_DIGEST;
          const fail = (message) => { throw new Error(message); };
          const ok = (condition, message) => condition || fail(message);
          const digest = (bytes) => `sha256:${createHash("sha256").update(bytes).digest("hex")}`;
          // maxBuffer matches the candidate ceiling asserted below. The default
          // is 1MB, and the candidate zip is ~192MB, so every binary download
          // failed as an opaque "GitHub API request failed".
          const runGh = (args, { binary = false, input } = {}) => spawnSync("gh", args, { encoding: binary ? null : "utf8", input, maxBuffer: 536870912 });
          const baseArgs = ["api", "-H", `X-GitHub-Api-Version: ${env.GITHUB_API_VERSION}`];
          const api = (path, { method, body, binary = false, accept } = {}) => {
            const args = [...baseArgs];
            if (accept) args.push("-H", `Accept: ${accept}`);
            if (method) args.push("--method", method);
            if (body) args.push("--input", "-");
            args.push(path);
            const result = runGh(args, { binary, input: body ? JSON.stringify(body) : undefined });
            if (result.status !== 0) fail("GitHub API request failed");
            return binary ? result.stdout : JSON.parse(result.stdout || "{}");
          };
          const maybe = (path) => { const result = runGh([...baseArgs, path]); if (result.status === 0) return JSON.parse(result.stdout || "{}"); if (/\bHTTP 404\b/.test(String(result.stderr))) return null; fail("GitHub API preflight failed"); };
          ok(/^[0-9]+$/.test(releaseId) && /^[0-9]+$/.test(runId) && /^[0-9]+$/.test(attempt) && /^[0-9]+$/.test(artifactId) && /^[0-9]+$/.test(env.FINALIZATION_RUN_ID) && /^[0-9]+$/.test(env.FINALIZATION_RUN_ATTEMPT), "invalid numeric identity");
          ok(/^[a-f0-9]{40}$/.test(sha) && env.EXACT_WORKFLOW_SHA === sha && env.DISPATCH_SHA === sha && env.DISPATCH_REF === `refs/tags/${tag}` && env.DISPATCH_REF_TYPE === "tag" && /^ariadnev@(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-beta\.[1-9]\d*)?$/.test(tag), "exact ref identity required");
          ok(/^sha256:[a-f0-9]{64}$/.test(artifactDigest) && artifactName === `ariadnev-candidate-${sha}-run-${runId}-attempt-${attempt}`, "candidate identity drift");
          // The repository setting itself is unreadable here: GET
          // /repos/{owner}/{repo}/immutable-releases answers 403 "Resource not
          // accessible by integration" to GITHUB_TOKEN under every grantable
          // permission, because it needs an administration scope the workflow
          // token cannot hold. Immutability is asserted on the published release
          // instead, which is the outcome the setting only predicts.
          const candidateRun = api(`repos/${repo}/actions/runs/${runId}`);
          ok(candidateRun.path === ".github/workflows/release.yml" && candidateRun.event === "push" && candidateRun.head_sha === sha && String(candidateRun.run_attempt) === attempt && candidateRun.status === "completed" && candidateRun.conclusion === "success", "candidate run drift");
          // The candidate build waited for CI's verdict on this SHA before it
          // built (packages/cli/scripts/require-ci-verdict.mjs); asserting it
          // again here is what makes "refuse to cut on red" hold at the moment
          // of publication, not only at the moment of building. Newest run per
          // name, the way a required status check is evaluated, so a re-run
          // cannot turn an earlier red green and a later red is not ignored.
          const ciCheck = "Lint · Build · Test";
          const ciRuns = (api(`repos/${repo}/commits/${sha}/check-runs?check_name=${encodeURIComponent(ciCheck)}&per_page=100`).check_runs ?? [])
            .filter((run) => run.name === ciCheck && run.head_sha === sha)
            .sort((a, b) => String(b.started_at ?? "").localeCompare(String(a.started_at ?? "")));
          ok(ciRuns[0]?.status === "completed" && ciRuns[0]?.conclusion === "success", `CI verdict refused: "${ciCheck}" on ${sha} is ${ciRuns[0] ? `${ciRuns[0].status}/${ciRuns[0].conclusion}` : "absent"}`);
          const artifact = api(`repos/${repo}/actions/artifacts/${artifactId}`);
          ok(String(artifact.id) === artifactId && artifact.name === artifactName && artifact.digest === artifactDigest && !artifact.expired && String(artifact.workflow_run?.id) === runId && artifact.workflow_run?.head_sha === sha, "artifact envelope drift");
          ok(artifact.size_in_bytes > 0 && artifact.size_in_bytes <= 536870912 && !Number.isNaN(Date.parse(artifact.created_at)) && Date.parse(artifact.expires_at) > Date.now(), "artifact bounds drift");
          const tagRef = api(`repos/${repo}/git/ref/tags/${tag}`);
          ok(tagRef.object?.type === "tag", "annotated candidate tag required");
          const tagObject = api(`repos/${repo}/git/tags/${tagRef.object.sha}`);
          ok(tagObject.object?.type === "commit" && tagObject.object.sha === sha, "tag target drift");
          const marker = "ariadnev-candidate-envelope-v1\n";
          ok(String(tagObject.message || "").startsWith(marker), "candidate envelope missing from tag");
          const envelope = JSON.parse(tagObject.message.slice(marker.length));
          ok(envelope.schemaVersion === 1 && envelope.schema === "https://ariadnev.com/schemas/candidate-envelope.schema.json" && envelope.repository === repo && envelope.runId === runId && envelope.runAttempt === attempt, "candidate envelope schema drift");
          ok(envelope.artifactId === artifactId && envelope.artifactName === artifactName && envelope.artifactDigest === artifactDigest && envelope.artifactSize === artifact.size_in_bytes && envelope.createdAt === artifact.created_at && envelope.expiresAt === artifact.expires_at && envelope.workflowPath === ".github/workflows/release.yml" && envelope.headSha === sha && Array.isArray(envelope.rejectedArtifacts), "candidate envelope data drift");
          ok(envelope.rejectedArtifacts.length <= 32 && new Set(envelope.rejectedArtifacts.map((entry) => entry.artifactId)).size === envelope.rejectedArtifacts.length && envelope.rejectedArtifacts.every((entry) => /^[0-9]+$/.test(entry.artifactId) && entry.artifactId !== artifactId && entry.artifactName === `ariadnev-candidate-${sha}-run-${entry.runId}-attempt-${entry.runAttempt}` && /^[0-9]+$/.test(entry.runId) && /^[0-9]+$/.test(entry.runAttempt) && /^sha256:[a-f0-9]{64}$/.test(entry.artifactDigest)), "rejected candidate envelope drift");
          const zip = api(`repos/${repo}/actions/artifacts/${artifactId}/zip`, { binary: true });
          ok(digest(zip) === artifactDigest, "artifact zip digest drift");
          mkdirSync("candidate", { recursive: true }); writeFileSync("candidate/candidate.zip", zip);
          const listing = execFileSync("unzip", ["-Z1", "candidate/candidate.zip"], { encoding: "utf8" }).trim().split("\n").filter(Boolean);
          ok(listing.length <= 32 && listing.every((name) => /^[A-Za-z0-9][A-Za-z0-9._@+-]*$/.test(name)), "unsafe candidate inventory");
          const sizes = execFileSync("unzip", ["-l", "candidate/candidate.zip"], { encoding: "utf8" }).split("\n").map((line) => /^\s*(\d+)\s+(?:\d{4}-\d{2}-\d{2}|\d{2}-\d{2}-\d{4})\s+\d{2}:\d{2}\s+(.+)$/.exec(line)).filter(Boolean).map((match) => Number(match[1]));
          ok(sizes.length === listing.length && sizes.every((size) => Number.isSafeInteger(size) && size >= 0) && sizes.reduce((sum, size) => sum + size, 0) <= 536870912, "candidate expands beyond the byte limit");
          execFileSync("unzip", ["-q", "candidate/candidate.zip", "-d", "candidate"]);
          const attestation = JSON.parse(readFileSync("candidate/release-artifact-attestation.json", "utf8"));
          ok(attestation.schemaVersion === 2 && attestation.schema === "https://ariadnev.com/schemas/release-artifact-attestation.schema.json" && attestation.artifactName === artifactName, "attestation schema drift");
          ok(attestation.workflow?.runId === runId && attestation.workflow?.runAttempt === attempt && attestation.workflow?.path === ".github/workflows/release.yml" && attestation.workflow?.ref === `${repo}/.github/workflows/release.yml@refs/heads/main` && attestation.workflow?.sha === sha && /^sha256:[a-f0-9]{64}$/.test(attestation.workflow?.digest), "attestation workflow drift");
          ok(attestation.product?.sha === sha && attestation.product?.tag === tag && tag === `ariadnev@${attestation.product?.version}`, "attestation product drift");
          ok(attestation.generator?.path === "packages/cli/scripts/generate-docs-bundle.ts" && attestation.generator?.sha === sha && /^sha256:[a-f0-9]{64}$/.test(attestation.generator?.digest), "attestation generator drift");
          const sourceFiles = [{ path: attestation.workflow.path, expected: attestation.workflow.digest }, { path: attestation.generator.path, expected: attestation.generator.digest }];
          const rawSource = (path) => api(`repos/${repo}/contents/${path}?ref=${sha}`, { binary: true, accept: "application/vnd.github.raw+json" });
          for (const file of sourceFiles) ok(/^sha256:[a-f0-9]{64}$/.test(file.expected) && digest(rawSource(file.path)) === file.expected, `source digest drift: ${file.path}`);
          const finalizerWorkflowDigest = digest(rawSource(".github/workflows/finalize-release.yml"));
          const assets = [...(attestation.releaseAssets || [])].sort((left, right) => left.name.localeCompare(right.name));
          const required = ["checksums.txt", "docs-bundle-manifest-v1.schema.json", "docs-bundle.manifest.json", "docs-bundle.tar.gz", "ariadnev-darwin-arm64", "ariadnev-darwin-x64", "ariadnev-linux-arm64", "ariadnev-linux-x64", "ariadnev-windows-x64.exe"].sort((left, right) => left.localeCompare(right));
          ok(JSON.stringify(assets.map((entry) => entry.name)) === JSON.stringify(required) && JSON.stringify([...listing].sort()) === JSON.stringify(["release-artifact-attestation.json", ...required].sort()), "release asset inventory drift");
          for (const asset of assets) { const bytes = readFileSync(`candidate/${asset.name}`); ok(asset.size === bytes.length && asset.digest === digest(bytes), `candidate asset drift: ${asset.name}`); }
          const checksumLines = readFileSync("candidate/checksums.txt", "utf8").trim().split("\n").map((line) => /^([a-f0-9]{64})  ([A-Za-z0-9][A-Za-z0-9._@+-]*)$/.exec(line));
          ok(checksumLines.every(Boolean) && JSON.stringify(checksumLines.map((match) => match[2]).sort()) === JSON.stringify(required.filter((name) => name !== "checksums.txt")), "checksums inventory drift");
          for (const match of checksumLines) ok(assets.find((asset) => asset.name === match[2])?.digest === `sha256:${match[1]}`, `checksum drift: ${match[2]}`);
          // The release signature. Read the public key out of the source this
          // release is built from, so the key that verifies here is by
          // construction the key the shipped binary carries — not a copy that
          // can drift. `release-workflow.test.mjs` asserts this extraction still
          // matches the constant, so a refactor breaks CI rather than a release.
          const signingSource = rawSource("packages/cli/src/cli/update-signature.ts").toString("utf8");
          const keyMatches = [...signingSource.matchAll(/^export const UPDATE_SIGNING_PUBLIC_KEY = "([A-Za-z0-9+/=]*)";$/gm)];
          ok(keyMatches.length === 1, "release signing key not found in source (extraction shape changed)");
          const publicKeyDer = Buffer.from(keyMatches[0][1], "base64");
          ok(publicKeyDer.length === 44, "release signing key is not a 44-byte Ed25519 SPKI");
          const publicKey = createPublicKey({ key: publicKeyDer, format: "der", type: "spki" });
          ok(publicKey.asymmetricKeyType === "ed25519", "release signing key is not Ed25519");
          // The bare version, not the tag: `parseLatestTag` strips the
          // `ariadnev@` prefix before the binary verifies, so signing the tag
          // here would make every update fail verification.
          const signedBytes = Buffer.concat([Buffer.from(`${attestation.product.version}\n`, "utf8"), readFileSync("candidate/checksums.txt")]);
          const signatureB64 = String(env.CHECKSUMS_SIGNATURE || "").trim();
          ok(/^[A-Za-z0-9+/]{86}==$/.test(signatureB64), "checksums signature is not a base64 Ed25519 signature");
          ok(verifySignature(null, signedBytes, publicKey, Buffer.from(signatureB64, "base64")), "checksums signature did not verify against the release key");
          writeFileSync("candidate/checksums.txt.sig", `${signatureB64}\n`);
          const downloadAsset = (id) => api(`repos/${repo}/releases/assets/${id}`, { binary: true, accept: "application/octet-stream" });
          // `expected` is the candidate inventory plus whatever finalization
          // itself added. The signature is not in the candidate and never can be
          // — it is made after the candidate is built, over its checksums — so
          // it cannot be folded into `required`, which is the candidate's own
          // closed inventory and is asserted against the attestation and the zip.
          const signatureAsset = { name: "checksums.txt.sig", size: Buffer.byteLength(`${signatureB64}\n`), digest: digest(Buffer.from(`${signatureB64}\n`)) };
          const verifyAssetBytes = (release, expected) => { for (const asset of expected) { const remote = (release.assets || []).find((entry) => entry.name === asset.name); ok(remote && remote.size === asset.size && digest(downloadAsset(remote.id)) === asset.digest, `remote asset drift: ${asset.name}`); } };
          const verifyAssets = (release, expected) => { ok((release.assets || []).length === expected.length, "remote asset count drift"); verifyAssetBytes(release, expected); };
          // Not resolved by tag here: a draft is invisible to
          // /releases/tags/{tag}, which answers 404 until it is published. The
          // tag binding is asserted after the PATCH, where it is both readable
          // and meaningful.
          const release = api(`repos/${repo}/releases/${releaseId}`), latestBefore = maybe(`repos/${repo}/releases/latest`);
          ok(String(release.id) === releaseId && release.draft === true && release.immutable === false && release.tag_name === tag && release.target_commitish === sha, "held draft drift");
          ok(!latestBefore || String(latestBefore.id) !== releaseId, "held draft is already latest");
          // A re-run has to be possible. If the upload succeeded and the publish
          // PATCH then failed, the draft already carries the signature — and
          // asserting the candidate inventory exactly would fail on the count
          // with a message about asset drift, leaving the release wedged as an
          // unpublishable draft until someone deleted the asset by hand.
          const existingSignature = (release.assets || []).find((entry) => entry.name === signatureAsset.name);
          verifyAssets(release, existingSignature ? [...assets, signatureAsset] : assets);
          // Uploaded to the draft, which is still mutable. After publish it is
          // not: `after.immutable` is asserted below, and that is also why no
          // past release can ever be given a signature retroactively.
          if (!existingSignature) {
            const uploadUrl = String(release.upload_url || "").replace(/\{[^}]*\}$/, "");
            ok(uploadUrl.startsWith("https://uploads.github.com/"), "unexpected release upload host");
            const upload = runGh([...baseArgs, "--method", "POST", "-H", "Content-Type: application/octet-stream", `${uploadUrl}?name=${signatureAsset.name}`, "--input", "candidate/checksums.txt.sig"]);
            ok(upload.status === 0, "release signature upload failed");
          }
          // Only the new asset is re-read. The others were just verified byte for
          // byte and the draft has had no other writer — re-downloading a ~192MB
          // set to learn that would cost more than it proves. A signature that
          // was already there has been verified above, in the `verifyAssets`
          // call, against the bytes this run just recomputed: a re-run with a
          // different signature fails there rather than silently keeping the old.
          const withSignature = existingSignature ? release : api(`repos/${repo}/releases/${releaseId}`);
          ok((withSignature.assets || []).length === assets.length + 1, "remote asset count drift after signature upload");
          if (!existingSignature) verifyAssetBytes(withSignature, [signatureAsset]);
          // A prerelease is published but never becomes "latest", and is flagged
          // as a prerelease on GitHub. `/version` answers from the latest
          // release, so this single field is what keeps a bare `av update` and a
          // bare `curl | bash` on stable while a beta exists. It is not a
          // convention — it is the mechanism.
          const isBeta = /-beta\.\d+$/.test(tag);
          api(`repos/${repo}/releases/${releaseId}`, { method: "PATCH", body: { draft: false, prerelease: isBeta, make_latest: isBeta ? "false" : "true" } });
          // `maybe` for latest: with only prereleases published, there is no
          // latest release and the endpoint answers 404.
          const after = api(`repos/${repo}/releases/${releaseId}`), latestAfter = maybe(`repos/${repo}/releases/latest`), tagAfter = api(`repos/${repo}/git/ref/tags/${tag}`);
          const byTagAfter = api(`repos/${repo}/releases/tags/${tag}`);
          // A beta must not have become latest. Asserting the negative matters
          // more than asserting the positive: a beta silently promoted to latest
          // is served to every bare installer, which is the whole failure this
          // channel is designed to avoid.
          const latestBinding = isBeta
            ? (!latestAfter || String(latestAfter.id) !== releaseId) && after.prerelease === true
            : String(latestAfter.id) === releaseId && latestAfter.tag_name === tag && after.prerelease === false;
          ok(after.draft === false && after.immutable === true && after.tag_name === tag && after.target_commitish === sha && latestBinding && String(byTagAfter.id) === releaseId && tagAfter.object?.sha === tagRef.object.sha, "published release drift");
          ok(!Number.isNaN(Date.parse(after.updated_at)), "published release timestamp drift");
          verifyAssets(after, [...assets, signatureAsset]);
          const finalization = { schemaVersion: 1, schema: "https://ariadnev.com/schemas/finalization-attestation.schema.json", runId: env.FINALIZATION_RUN_ID, runAttempt: env.FINALIZATION_RUN_ATTEMPT, repository: repo, releaseId, tag, sourceSha: sha, candidateEnvelopeDigest: digest(Buffer.from(JSON.stringify(envelope))), finalizerWorkflowDigest, releaseAssetSetDigest: digest(Buffer.from(JSON.stringify([...assets, signatureAsset]))), verifiedReleaseUpdatedAt: after.updated_at };
          const finalizationJson = JSON.stringify(finalization);
          appendFileSync(env["GITHUB_OUTPUT"], `finalization_attestation=${finalizationJson}\n`);
          if (env["GITHUB_STEP_SUMMARY"]) appendFileSync(env["GITHUB_STEP_SUMMARY"], `Finalized immutable release ${tag} from candidate artifact ${artifactId}.\n\nFinalization attestation: \`${finalizationJson}\`\n`);
          NODE
